[project]
name = "foaf-client"
version = "0.1.0"
description = "Python client for the FOAF protocol: auth.foaf.io token verification (ledger, contacts and custodian to follow)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "FOAF Foundation" }]
dependencies = ["pyjwt[crypto]>=2.8"]

[project.urls]
Source = "https://github.com/FOAF-Foundation/foaf-client"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foaf_client"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "RUF"]
