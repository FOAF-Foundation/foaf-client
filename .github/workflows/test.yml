name: test

on:
  push:
  pull_request:

jobs:
  ruby:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gem
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          # Matches what every consumer actually runs. The whole FOAF Rails
          # fleet moved to 3.4.11 on 2026-09-26 (rheos/railsbackend#55), so
          # testing this gem on 3.2 verified it against a Ruby no consumer
          # uses - and an EOL one at that (3.2 EOL 2026-03-31). The previous
          # value was a floating "3.2", which would have kept resolving onto
          # that EOL line indefinitely without ever looking out of date.
          ruby-version: "3.4.11"
          bundler-cache: true
          working-directory: gem
      - run: bundle exec rspec

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run check
